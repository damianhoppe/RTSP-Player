import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

def appVersionCode = 38
def appSiteUrl = "https://github.com/damianhoppe/RTSP-Player"
def urlAddModelForm = "https://docs.google.com/forms/d/e/1FAIpQLSdIlcGRIdQSlwCDhrjd2s62ZVPadYcQDpa2At543e9urx2VyQ/viewform?usp=sf_link"
def appVersionName = "1.7.4-beta.2.1"
def buildTime(String format = "yyyy-MM-dd") {
    def df = new SimpleDateFormat(format)
    df.setTimeZone(TimeZone.getTimeZone("UTC"))
    return df.format(new Date())
}

android {
    android.ndkVersion = "29.0.14033849"

    defaultConfig {
        compileSdk = 36
        targetSdk = 36
        minSdkVersion 23
        applicationId "pl.huczeq.rtspplayer"
        versionCode appVersionCode
        versionName "${appVersionName}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments["room.schemaLocation"] = "$projectDir/schemas"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "BUILD_TIME", "\"${buildTime("yyyy-MM-dd HH:mm:ss")}\"")
            buildConfigField("String", "SITE_URL", "\"${appSiteUrl}\"")
            buildConfigField("String", "URL_ADD_MODEL_FORM", "\"${urlAddModelForm}\"")
        }
        debug {
            versionNameSuffix "-debug"
            buildConfigField("String", "BUILD_TIME", "\"${buildTime("yyyy-MM-dd HH:mm:ss")}\"")
            buildConfigField("String", "SITE_URL", "\"${appSiteUrl}\"")
            buildConfigField("String", "URL_ADD_MODEL_FORM", "\"${urlAddModelForm}\"")
        }
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    splits {
        abi {
            boolean isBuildingBundle = gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("bundle")
            }
            enable !isBuildingBundle
            reset()
            include "x86", "x86_64", "armeabi-v7a", "arm64-v8a"
            universalApk = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    namespace = 'pl.huczeq.rtspplayer'
}

dependencies {
    def lifecycle_version = "2.11.1"
    def room_version = "2.8.5"

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.core:core:1.18.0'

    implementation('androidx.preference:preference:1.2.1') {
        exclude group: 'androidx.lifecycle' , module:'lifecycle-viewmodel-ktx'
    }

    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava3:$room_version"
    testImplementation "androidx.room:room-testing:$room_version"

    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    annotationProcessor "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.room:room-guava:$room_version"

    implementation "com.google.guava:guava:33.8.0-android"

    implementation 'com.github.jorgecastilloprz:fabprogresscircle:1.01@aar'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'org.videolan.android:libvlc-all:3.7.7'

    implementation "io.reactivex.rxjava3:rxjava:3.1.12"
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    implementation 'com.google.dagger:hilt-android:2.60.1'
    annotationProcessor 'com.google.dagger:hilt-android-compiler:2.60.1'

    testImplementation 'com.google.dagger:hilt-android-testing:2.60.1'
    testAnnotationProcessor 'com.google.dagger:hilt-compiler:2.60.1'

    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.60.1'
    androidTestAnnotationProcessor 'com.google.dagger:hilt-android-compiler:2.60.1'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    implementation 'org.awaitility:awaitility:4.3.0'

    implementation("androidx.media3:media3-exoplayer:1.11.1")
    implementation("androidx.media3:media3-exoplayer-rtsp:1.11.1")

    implementation 'androidx.core:core-splashscreen:1.2.0'

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.3.21"))
}